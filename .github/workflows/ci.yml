name: CI

# Run by hand only (Actions tab, or `gh workflow run ci.yml`): too many projects
# share the account's Actions minutes for every push to spend them.
# Locally, `npm run check` and `npm run test:e2e` cover the same ground.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Narration speed and voice treatments go through ffmpeg; its tests need it.
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
